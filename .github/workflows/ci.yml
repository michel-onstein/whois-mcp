name: ci

on:
  push:
    branches: [main]
    # Release tags publish a semver image. The chart's image.tag defaults to its
    # appVersion, so without a matching vX.Y.Z tag pushed here a default
    # `helm install` resolves to an image that was never published.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify formatting
        run: |
          out="$(gofmt -l $(find . -name '*.go'))"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      # No test may require live network access: registry responses are
      # captured in testdata/ precisely so CI never depends on a third party.
      - name: Test (race)
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # v8 rather than v6: .golangci.yml is version "2", and the v6 action
      # installs golangci-lint 1.64.8, which can neither read a v2 config nor
      # lint a module targeting a Go version newer than the one it was built
      # with. Both failures present as "can't load config", so the version pair
      # matters more than it looks.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The Redis-backed tests are opt-in via an env var so the suite above stays
  # hermetic. This job is where they actually run, against a real Redis rather
  # than a fake — the atomicity of refresh-token rotation depends on Redis
  # executing a Lua script atomically, and a fake would only test our belief
  # about that.
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Test against Redis
        env:
          WHOIS_MCP_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -race ./internal/cache/ ./internal/auth/

  # Build the image and exercise the full stack end to end: enrollment, a
  # lookup, and — the part that only a multi-replica stack can show — a session
  # enrolled against one replica refreshing against the other through shared
  # Redis. With per-replica memory stores that flow breaks silently.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t whois-mcp:ci \
            --build-arg VERSION=ci-${GITHUB_SHA::7} \
            --build-arg REVISION=${GITHUB_SHA} \
            --build-arg SOURCE=https://github.com/${GITHUB_REPOSITORY} .

      - name: Report image size
        run: docker images whois-mcp:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # Checked here, on every PR, rather than only at publish time: GHCR ties a
      # package to a repository by this label, and a wrong one yields a package
      # that looks published but inherits none of the repository's permissions
      # and shows up owned by nothing.
      - name: The image is tied to this repository
        run: |
          want="https://github.com/${GITHUB_REPOSITORY}"
          got="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' whois-mcp:ci)"
          if [ "$got" != "$want" ]; then
            echo "org.opencontainers.image.source is '$got', want '$want'"
            exit 1
          fi
          echo "source: $got"
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' whois-mcp:ci

      - name: Generate secrets
        run: |
          echo "WHOIS_MCP_ENROLLMENT_TOKEN=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          # A 32-byte Ed25519 seed, base64. Shared across both replicas on
          # purpose: a per-replica key means each rejects the other's tokens.
          echo "WHOIS_MCP_SIGNING_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Start the stack
        working-directory: deploy/docker
        run: |
          # --no-build because the image was just built above; compose finds it
          # by the explicit name both replicas share.
          docker compose up -d --no-build
          # The image has no shell, so readiness is polled from here rather than
          # with a container HEALTHCHECK.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 \
               && curl -fsS http://localhost:8081/readyz >/dev/null 2>&1; then
              echo "both replicas ready"; exit 0
            fi
            sleep 2
          done
          echo "replicas did not become ready"; docker compose logs; exit 1
        env:
          VERSION: ci
          WHOIS_MCP_IMAGE: whois-mcp:ci

      - name: End-to-end enrollment, lookup and cross-replica refresh
        run: ./scripts/e2e.sh

      - name: Stack logs on failure
        if: failure()
        working-directory: deploy/docker
        env:
          WHOIS_MCP_IMAGE: whois-mcp:ci
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: deploy/docker
        env:
          WHOIS_MCP_IMAGE: whois-mcp:ci
        run: docker compose down -v

  # The chart is verified by rendering it, not by deploying it: every check in
  # helm-verify.sh is either "this renders" or "this configuration is refused",
  # and the refusals are the valuable half — each one is a deployment that would
  # come up healthy and then behave inexplicably.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Verify the chart
        run: ./scripts/helm-verify.sh

  # Publish to GHCR, in the repository's own namespace: ghcr.io/<owner>/<repo>,
  # taken from github.repository so a transferred or renamed repository keeps
  # publishing to the matching package rather than to a stale hard-coded name.
  #
  # Gated on every other job, and on this being a push rather than a
  # pull_request: a fork's PR must never be able to publish, and a PR's ephemeral
  # merge commit is not something anyone should be able to pull.
  publish:
    needs: [test, lint, redis, image, helm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The one job that gets write access to anything. Declared here rather
      # than at the workflow level so no other job inherits it.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No setup-qemu-action: the Dockerfile's builder stage runs natively and
      # cross-compiles, so nothing is emulated.

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version string
        id: version
        run: |
          # A tag publishes its own name; a main push publishes the short SHA,
          # which is what the sha- image tag resolves to as well.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm64 is not optional in practice: Apple Silicon is where this
          # gets run by hand, and an amd64-only image runs there only under
          # emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
