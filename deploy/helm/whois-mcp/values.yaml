# Values for whois-mcp. See design §11.3.

image:
  # Where CI publishes: ghcr.io/<owner>/<repo> for this repository. GHCR ties the
  # package to the repository by the image's org.opencontainers.image.source
  # label, so this and that label name the same place.
  repository: ghcr.io/michel-onstein/whois-mcp
  # Empty means the chart's appVersion, so a `helm upgrade` after a version bump
  # does not silently keep the old image.
  #
  # That requires a matching release tag to have been pushed: appVersion 0.1.0
  # resolves to the :0.1.0 image, which exists only once `v0.1.0` is tagged. Off
  # a release, set this to `latest` or a `sha-<commit>` tag from a main build —
  # otherwise the pods sit in ImagePullBackOff for a tag that was never built.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------- the URL
# publicURL is the canonical https URI clients reach this server on. It is the
# OAuth issuer and, with /mcp appended, the token audience.
#
# Getting it wrong does not degrade anything: it rejects every token, because
# the aud in a minted token will not match the aud the verifier expects.
#
# Leave it empty and it is derived as https://<ingress.host>, which is what you
# want whenever the ingress is how clients reach this server — the two values
# name the same host, and setting only one of them is the mistake. Set it
# explicitly when clients arrive under some other name (a CDN, a proxy that
# rewrites Host) or when ingress.path is not "/", where the chart cannot know
# whether the controller rewrites the prefix. With no ingress it is required.
#
# An explicit value that disagrees with ingress.host is refused: the controller
# matches on Host, so requests to it would never reach this release.
publicURL: ""

# ---------------------------------------------------------------- secrets
secrets:
  # existingSecret is the name of a Secret you manage yourself — sealed-secrets,
  # external-secrets, or applied by hand. Preferred: the alternative puts
  # credentials in your values file and therefore in your git history.
  existingSecret: ""

  # Used only when existingSecret is empty. Both are required in that case.
  #
  # enrollmentToken is the single security boundary in a single-tenant
  # deployment: anyone holding it can mint a session with any scope.
  enrollmentToken: ""
  # signingKey is a base64 Ed25519 seed (32 bytes), or a PKCS#8 PEM. Optional:
  # unset, the server generates one at start. Sessions live in memory and die
  # with the pod anyway, so a key that dies with it loses nothing extra.
  signingKey: ""

  # Key names inside the Secret, so an existing Secret with different keys can
  # be used without renaming anything. The signing key is read as optional, so
  # an existing Secret that holds only the enrollment token is fine.
  enrollmentTokenKey: enrollment-token
  signingKeyKey: signing-key

# ---------------------------------------------------------------- service
service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  # host doubles as the source for publicURL when that is left empty, so it is
  # the one hostname to get right.
  #
  # A wildcard ("*.example.com") is routed by the controller but cannot be
  # derived from, so publicURL must be set explicitly alongside it.
  host: ""
  # A path other than "/" means publicURL cannot be derived: whether clients
  # address the prefix depends on a rewrite annotation this chart cannot read.
  path: /
  pathType: Prefix
  tls:
    enabled: true
    # secretName holds the certificate. Empty relies on the ingress
    # controller's default certificate.
    secretName: ""
  # forceHTTPS adds the redirect annotations for common controllers. The server
  # itself refuses cleartext for anything but loopback, so this stops a client
  # from getting a confusing refusal rather than a redirect.
  forceHTTPS: true

# ---------------------------------------------------------------- egress
networkPolicy:
  enabled: true
  # ports is the single highest-value list in this chart.
  #
  # 443 for RDAP and the IANA bootstrap file; 43 for WHOIS. Omitting 43 breaks
  # every ccTLD that publishes no RDAP service — which is most of them — and the
  # symptom is "unknown" answers with warnings about unreachable hosts, so it
  # reads like a parser bug rather than a firewall rule.
  egressPorts:
    - 443
    - 43
  # dnsPorts are needed to resolve registry hostnames at all.
  dnsPorts:
    - 53
  # extraEgress is appended verbatim, for anything the chart does not model.
  extraEgress: []

# ---------------------------------------------------------------- pod shape
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit by default: throttling a server whose latency is dominated by
    # upstream waits makes tail latency worse without saving anything useful.
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------- observability
metrics:
  # serviceMonitor is created only when the Prometheus operator's CRD is
  # present. Rendering it unconditionally would fail `helm install` on a cluster
  # without the operator.
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

otel:
  # endpoint is an OTLP/HTTP collector URL. Empty disables export; W3C
  # trace-context is still propagated from the MCP _meta fields either way.
  endpoint: ""

logLevel: info

# extraEnv is appended verbatim, for anything the chart does not model.
extraEnv: []
