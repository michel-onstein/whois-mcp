{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whois-mcp.fullname" . }}
  labels:
    {{- include "whois-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Rendered from values, which means these end up in the release history and in
  # whatever holds the values file. Prefer secrets.existingSecret with
  # sealed-secrets or external-secrets for anything that is not a test cluster.
  {{ .Values.secrets.enrollmentTokenKey }}: {{ .Values.secrets.enrollmentToken | quote }}
  {{ .Values.secrets.signingKeyKey }}: {{ .Values.secrets.signingKey | quote }}
{{- end }}
