{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "whois-mcp.fullname" . }}
  labels:
    {{- include "whois-mcp.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.forceHTTPS }}
    # The server refuses cleartext for anything but loopback, so without a
    # redirect a client arriving over http gets a refusal rather than being sent
    # to the right place. Both spellings are set because which one applies
    # depends on the controller, and an unrecognised annotation is inert.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "whois-mcp.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
