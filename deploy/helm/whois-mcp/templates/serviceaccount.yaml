{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "whois-mcp.serviceAccountName" . }}
  labels:
    {{- include "whois-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server calls no Kubernetes API, so it needs no token mounted. Turning this
# off removes a credential from every pod that nothing was going to use.
automountServiceAccountToken: false
{{- end }}
