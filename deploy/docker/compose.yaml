# Run the image locally, the way CI's end-to-end check does (design §11.2).
#
# One server, nothing else. The request path needs no other service: the cache
# and the sessions are in-process, which is the single-replica decision of
# design §11.3. The cost is that `docker compose restart` forgets every session
# and each client enrolls again.

name: whois-mcp

services:
  whois-mcp:
    # Both `image` and `build` on purpose. With both, `docker compose up` builds
    # once and tags the result — which is also what lets CI build the image
    # separately and bring the stack up with --no-build.
    image: ${WHOIS_MCP_IMAGE:-whois-mcp:compose}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-compose}
    environment:
      WHOIS_MCP_LISTEN: ":8080"
      # The canonical URI, and therefore the token audience. It must match what
      # a client actually connects to or every token is rejected.
      WHOIS_MCP_PUBLIC_URL: "http://localhost:8080"
      WHOIS_MCP_ENROLLMENT_TOKEN: "${WHOIS_MCP_ENROLLMENT_TOKEN:?set WHOIS_MCP_ENROLLMENT_TOKEN, e.g. export WHOIS_MCP_ENROLLMENT_TOKEN=$(openssl rand -base64 32)}"
      # Optional. Unset, the server generates a key at start; since sessions
      # die with the process anyway, a key that dies with it loses nothing.
      WHOIS_MCP_SIGNING_KEY: "${WHOIS_MCP_SIGNING_KEY:-}"
      WHOIS_MCP_LOG_LEVEL: "${WHOIS_MCP_LOG_LEVEL:-info}"
    ports:
      - "8080:8080"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image has no shell and no curl, so the check runs from the compose
      # host rather than inside the container. Kubernetes probes /readyz over
      # HTTP instead, which is the real deployment path.
      disable: true
