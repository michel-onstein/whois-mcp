version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - noctx        # every outbound call must carry a context deadline
    - revive
    - staticcheck
    - unconvert
    - unused
issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, noctx, bodyclose]
