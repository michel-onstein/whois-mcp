version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - noctx        # every outbound call must carry a context deadline
    - revive
    - staticcheck
    - unconvert
    - unused
  # v2 spells this linters.exclusions.rules. It was issues.exclude-rules in v1,
  # and this file declared version "2" while still using the v1 key — so
  # `golangci-lint config verify` rejected it outright and the linter never ran.
  exclusions:
    rules:
      # Tests deliberately ignore errors from helper calls whose failure would
      # already fail the test, construct requests without a deadline, and leave
      # response bodies to the test server's cleanup.
      - path: _test\.go
        linters: [errcheck, noctx, bodyclose]
